data:
  data_dir: data
  max_length: 512
  remote_data_dir: data_remote
  random_state: 42
  val_size: 0.1
logging:
  mlflow_uri: http://127.0.0.1:8080
  experiment_name: toxic_russian_comments
model:
  pretrained_model_name: cointegrated/rubert-tiny2
  num_labels: 2
  freeze_backbone: true
training:
  output_dir: ./rubert_tiny2_toxic
  train_batch_size: 128
  eval_batch_size: 256
  num_epochs: 1
  learning_rate: 2.0e-05
  weight_decay: 0.01
  eval_strategy: steps
  eval_steps: 300
  logging_steps: 300
  save_steps: 500
  save_total_limit: 2
  num_workers: 4
