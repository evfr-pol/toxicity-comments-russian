[project]
name = "toxicity-comments-russian"
version = "0.1.0"
description = "Here we train and infer model for prediction the toxicity of comments in russian language."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dvc>=3.65.0",
    "torch>=2.9.1",
    "transformers>=4.57.3",
]

[dependency-groups]
dev = [
    "datasets>=4.4.2",
    "dvc[azure,gdrive]>=3.65.0",
    "mlflow>=3.8.0",
    "pre-commit>=4.5.1",
]

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "W", "I", "B", "SIM", "A", "RET", "PTH"]
